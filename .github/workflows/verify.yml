name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Windows and dashboard sources
        shell: powershell
        run: .\tests\verify.ps1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check menu bar app
        run: >
          xcrun --sdk macosx swiftc
          -parse-as-library
          -typecheck
          -target "$(uname -m)-apple-macos13.0"
          macos/Sources/RelayWatchApp.swift
          -framework SwiftUI
          -framework AppKit
