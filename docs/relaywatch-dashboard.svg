      <path d="M30 192 C130 165 195 223 285 188 S445 137 530 187 S695 229 780 175 S945 142 1060 194 S1122 206 1150 179" fill="none" stroke="url(#accent)" stroke-width="5"/>
      <line x1="30" y1="238" x2="1154" y2="238" stroke="#2d2831"/>
      <text x="30" y="275" fill="#aaa1af" font-size="15">Ethernet ↓ 18.4 MB/s  ↑ 4.2 MB/s</text>
      <text x="895" y="275" fill="#aaa1af" font-size="15">Today 1.248 kWh</text>
    </g>
